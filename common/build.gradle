plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

loom {
    runConfigs.clear()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mixin API for common mixins (provided by each loader at runtime)
    compileOnly "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    // Gson is bundled with MC
    compileOnly 'com.google.code.gson:gson:2.10.1'
    // Logging (provided at runtime by MC)
    compileOnly 'org.slf4j:slf4j-api:2.0.13'
}
